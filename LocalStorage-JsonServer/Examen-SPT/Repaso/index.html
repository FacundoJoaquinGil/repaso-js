<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen-SPT</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">

        <header>
            <img src="../SPT.png" alt="logo-spt">
            <a href="#home">Home</a>
            <a href="#listado">Listado</a>
            <a href="#footer">Footer</a>

        </header>

        <main id="home">
            <h1 class="titulo">Examen Recuperatorio SPT</h1>
            
            <h3>Todos los usuarios:</h3>
            <ul id="todosLosUsuarios" class="lista"></ul>

            <h3>Usuarios Activos ✅</h3>
            <ul id="usuariosActivos" class="lista"></ul>

            <div class="container-email">
                <h3>Busca por Email 📧</h3>

                <form id="form">
                    <input id="inputEmail" type="email" required>
                    <button type="submit" class="btn-buscar">Buscar</button>
                    <p id="emailEncontrado"></p>
                </form>

            </div>

        </main>

        <footer>
            <p id="fechaFooter"></p>
        </footer>

    </div>

    <script src="./script.js"></script>

</body>

</html>
