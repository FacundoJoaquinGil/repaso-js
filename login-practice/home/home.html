<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <link rel="icon" href="../logo.svg">
    <link rel="stylesheet" href="./home.css">
</head>

<body>

    <header>
        <div class="columna1">
            <a class="foto-perfil-contenedor" href="#home">
                <img class="foto-perfil" id="fotoPerfil" alt="foto-perfil">
            </a>

            <h2 id="titulo-bienvenida" class="titulo-bienvenida"></h2>
        </div>

        <div class="columna2">
            <p id="parrafoMail" class="parrafoMail"></p>
            <button class="btn-cs" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </header>

    <main>
        <form id="formTarea" class="container-home">
            <h3 class="titulo-tarea">Agrega una tarea</h3>

            <textarea class="txtTarea" id="txtTarea" placeholder="Escribe tu tarea aqui..." minlength="4"
                maxlength="350" required></textarea>

            <button class="btn-subirTarea" type="submit">Publicar Tarea</button>
        </form>

        <div class="contenedor-padre-tareas">
            <div id="contenedorTareas" class="contenedor-tareas">
                <!-- <p class="tareas-vacia">No hay tareas todavía. ¡Escribe la primera!</p> -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <nav class="footer-links">
            <a href="">Términos</a>
            <a href="">Privacidad</a>
            <a href="">Documentación</a>
            <a href="">Contacto</a>
            <a href="">Soporte</a>
            <a href="">No compartir mi información personal</a>
        </nav>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="./home.js"></script>
</body>

</html>
