<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario con JSON</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <header></header>
  <main>
    <div class="container mt-5">
    <div class="card shadow-lg p-4">
      <h2 class="text-center mb-4">Formulario de Registro</h2>
      <form id="formRegistro">
        <div class="mb-3">
          <label for="nombre" class="form-label fw-bold">Nombre</label>
          <input type="text" class="form-control" id="nombre" required>
        </div>
        <div class="mb-3">
          <label for="edad" class="form-label fw-bold">Edad</label>
          <input type="number" class="form-control" id="edad" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label fw-bold">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" id="descargarBtn" class="btn btn-success">Descargar JSON</button>
          <button type="button" id="limpiarBtn" class="btn btn-danger">Limpiar Datos</button>
        </div>
      </form>
      <hr>
      <h5 class="mt-4">Datos guardados:</h5>
      <pre id="datosGuardados" class="bg-body-secondary p-3 rounded"></pre>
    </div>
  </div>
  </main>
  <footer class="bg-danger mt-5">
      <p class="mb-0 text-center text-white">Todos los derechos Reservados </p>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
