<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="./logo.svg">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

   <div class="contedor-padre-login">
     <main>

            <div class="contenedor-titulo-login">
                <img src="./logo.svg" alt="logo">
                <h1>Ingreso de usuarios</h1>
            </div>

            <div class="contenedor-login">
                <form id="form">

                    <label> Correo electrónico
                        <input type="email" minlength="6" required>
                    </label>

                    <label> Contraseña
                        <input type="text" minlength="6" placeholder="••••••••" required>
                    </label>

                    <div class="botones-login">
                        <button class="btn-ingresar" type="submit">Iniciar sesión</button>
                        <a href="./problema-tuyo.jpg">Olvidaste tu contraseña?</a>
                        <a href="">Crear una cuenta</a>
                    </div>
                </form>
            </div>

    </main>

    <footer class="footer">
        <nav class="footer-links">
            <a href="">Términos</a>
            <a href="">Privacidad</a>
            <a href="">Documentación</a>
            <a href="">Contacto</a>
            <a href="">Soporte</a>
            <a href="">No compartir mi información personal</a>
        </nav>
    </footer>

   </div>


    <script src="./login.js"></script>
</body>

</html>
